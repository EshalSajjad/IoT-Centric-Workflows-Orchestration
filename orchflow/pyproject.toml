[project]
name = "orchflow"
version = "0.1.0"
description = "Orchflow rewrite: orchestration of IoT-centric distributed workflows (GOM/LOM), simulated and live."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
sim = ["simpy>=4.1"]                                          # Track 2
live = ["aiomqtt>=2.0"]                                       # Track 3
analysis = ["pandas>=2.2", "scipy>=1.12", "matplotlib>=3.8"]  # Track 2
dev = ["pytest>=8", "ruff>=0.5", "pyright>=1.1.370"]

[project.scripts]
orchflow = "orchflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
