# Table I replication: traffic workload, LOM, legacy mobility, sim, 60 min, paper testbed (20 x 20).
# Mobility: what the legacy code did (fixed residence table + probability rule, deviations D4).
#   orchflow run experiments/table1/traffic_lom_legacy.yaml
#   orchflow table1 results/table1-traffic-lom-legacy
name: table1-traffic-lom-legacy
workflow: ../../workflows/traffic.yaml
testbed: ../../configs/testbed_20x20.yaml
runtime: sim
orchestration: {name: lom}
binding: {name: nearest}
mobility: {name: legacy, params: {mode: lom}}
network: {name: ideal}
work: {name: fixed}
duration_s: 3600
seeds: 100        # deviations P3: mean +- 95% CI over >= 100 seeds
output_dir: ../../results
